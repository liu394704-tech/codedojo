<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码道场 · CodeDojo</title>
<style>
:root{
  --bg:#141517; --panel:#1d1f23; --panel2:#232629; --border:#32363b;
  --text:#e8e8e6; --muted:#9a9a94; --faint:#6e6e68;
  --accent:#6c8cff; --accent-dim:#39466e;
  --good:#4cc38a; --warn:#f0b429; --bad:#e5484d; --info:#6c8cff;
  --radius:12px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:13px}
input,textarea,select{font-family:inherit;font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:56px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px}
header{position:sticky;top:0;z-index:50;background:rgba(20,21,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hd{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:600;font-size:16px;letter-spacing:.5px}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px}
nav button.active{background:var(--panel2);color:var(--text)}
nav button:hover:not(.active){color:var(--text)}
.streak{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted)}
.streak b{color:var(--warn);font-size:15px}
.view{display:none;padding-top:24px}
.view.active{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
h1{font-size:20px;margin-bottom:6px;font-weight:600}
h2{font-size:16px;margin-bottom:12px;font-weight:600}
h3{font-size:14px;margin:14px 0 8px;font-weight:600;color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.g2,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.g2,.g4{grid-template-columns:1fr}}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat .num{font-size:24px;font-weight:600;color:var(--accent)}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.btn{background:var(--accent);color:#fff;padding:9px 18px;font-weight:500}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.small{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* ---- Hot100 式题单 ---- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:99px}
.tabs button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.prow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .12s}
.prow:hover{border-color:var(--accent)}
.prow.now{border-color:var(--warn)}
.pst{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.pst.done{background:var(--good);border-color:var(--good);color:#fff}
.prow .name{font-weight:500;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .path{color:var(--faint);font-size:12px;font-family:var(--mono)}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;flex:none}
.badge.e{color:#2ea043;background:rgba(46,160,67,.15)}
.badge.m{color:#f0b429;background:rgba(240,180,41,.15)}
.badge.h{color:#e5484d;background:rgba(229,72,77,.15)}
.dayb{font-size:11px;color:var(--warn);border:1px solid rgba(240,180,41,.4);padding:1px 7px;border-radius:99px;flex:none}
.nc{font-size:11px;color:var(--faint);flex:none}
.ringwrap{display:flex;align-items:center;gap:16px;margin:6px 0 2px}
.ringwrap .rt{font-size:13px;color:var(--muted)}
/* ---- 练习页双栏 ---- */
.prac{display:grid;grid-template-columns:minmax(330px,2fr) 3fr;gap:16px;align-items:start}
@media(max-width:920px){.prac{grid-template-columns:1fr}}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(50,54,59,.4);cursor:pointer}
.chk input{width:16px;height:16px;flex:none;margin-top:3px;accent-color:var(--good);cursor:pointer}
.chk span.on{color:var(--faint);text-decoration:line-through}
/* 计时器 */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer .disp{font-family:var(--mono);font-size:26px;font-weight:600;min-width:84px}
.timer .disp.hot{color:var(--warn)}
.tbar{flex:1;min-width:80px;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:0%}
.timeup{background:rgba(240,180,41,.12);border:1px solid var(--warn);color:var(--warn);padding:8px 12px;border-radius:8px;margin-top:8px;display:none;font-size:13px}
/* ---- 代码阅读器 + 批注 ---- */
.codebox{background:#101113;border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:560px;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.codebox table{border-collapse:collapse;width:100%}
.codebox td{padding:0 10px 0 0;white-space:pre-wrap;vertical-align:top}
.codebox .ln{color:var(--faint);text-align:right;user-select:none;width:1%;min-width:44px;padding-left:14px;cursor:pointer}
.codebox .ln:hover{color:var(--warn)}
.codebox tr:hover{background:rgba(108,140,255,.05)}
.codebox tr.hlq{background:rgba(240,180,41,.09)}
.codebox tr.hli{background:rgba(76,195,138,.09)}
.codebox tr.hlb{background:rgba(229,72,77,.10)}
.codebox tr.hln{background:rgba(108,140,255,.08)}
.k{color:#7aa2f7}.s{color:#9ece6a}.c{color:#565f89;font-style:italic}.n{color:#ff9e64}
.annrow td{padding:8px 12px;background:var(--panel2)}
.annrow .hd2{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted)}
.exnote{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed rgba(50,54,59,.6);font-size:12.5px}
.exnote .tx{flex:1;color:var(--text)}
.exnote .del{color:var(--faint);cursor:pointer;flex:none}
.exnote .del:hover{color:var(--bad)}
.ntypes{display:flex;gap:6px;margin:6px 0}
.ntypes button{border-radius:99px;padding:3px 10px;font-size:11.5px;border:1px solid var(--border);background:transparent;color:var(--muted)}
.ntypes button.on{color:var(--text);font-weight:600}
.ntypes button.on[data-t=q]{border-color:var(--warn);color:var(--warn)}
.ntypes button.on[data-t=i]{border-color:var(--good);color:var(--good)}
.ntypes button.on[data-t=b]{border-color:var(--bad);color:var(--bad)}
.ntypes button.on[data-t=n]{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.nrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(50,54,59,.4);cursor:pointer;font-size:12.5px}
.nrow:hover .gtxt{color:var(--text)}
.nrow .gl{color:var(--faint);font-family:var(--mono);flex:none}
.nrow .gtxt{color:var(--muted)}
.flash{animation:fl 1.2s}
@keyframes fl{0%{background:rgba(108,140,255,.35)}100%{background:transparent}}
/* 问答 */
.qa{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}
.qa .q{padding:11px 13px;background:var(--panel2);display:flex;gap:10px;cursor:pointer}
.qa .q b{color:var(--accent);font-family:var(--mono)}
.qa .a{padding:11px 13px;display:none;border-top:1px solid var(--border)}
.qa.open .a{display:block}
.qa .q::after{content:"展开";margin-left:auto;color:var(--faint);font-size:12px}
.qa.open .q::after{content:"收起"}
table.plain{width:100%;border-collapse:collapse;font-size:13px}
table.plain th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border)}
table.plain td{padding:8px 10px;border-bottom:1px solid rgba(50,54,59,.5);vertical-align:top}
/* 卡片 */
.fcard{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.fcard.master{border-left-color:var(--good);opacity:.65}
.fcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fcard .topic{font-weight:600}
.fcard .date{color:var(--faint);font-size:12px;margin-left:auto}
.fcard .desc{margin-top:6px;color:var(--muted)}
.fcard .src{margin-top:4px;font-size:12px;color:var(--faint)}
.fcard .ops{margin-top:8px;display:flex;gap:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.tag.good{color:var(--good)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--good);color:var(--text);padding:10px 22px;border-radius:10px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.back{margin-bottom:14px}
.pill{display:inline-block;background:var(--panel2);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted);margin-right:6px}
.links a{display:block;padding:4px 0}
.note{font-size:12px;color:var(--faint)}
.empty{color:var(--faint);text-align:center;padding:30px 0}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo">代码<span>道场</span></div>
  <nav id="nav">
    <button data-v="home" class="active">今日</button>
    <button data-v="list">题单</button>
    <button data-v="notes">批注库</button>
    <button data-v="cards">卡片本</button>
    <button data-v="bugs">病灶笔记</button>
    <button data-v="road">路线与资料</button>
  </nav>
  <div class="streak"><span>🔥 连续 <b id="streakN">0</b> 天</span></div>
</div></header>

<div class="wrap">
<section class="view active" id="v-home"></section>
<section class="view" id="v-list"></section>
<section class="view" id="v-cards"></section>
<section class="view" id="v-bugs"></section>
<section class="view" id="v-notes"></section>
<section class="view" id="v-road"></section>
</div>
<div id="toast"></div>

<script>
/* ================= 题库数据 ================= */
const DAYS=[
{id:1,file:"requests/src/requests/hooks.py",gh:"https://github.com/psf/requests/blob/main/src/requests/hooks.py",title:"requests/hooks.py",lines:48,focus:"读真代码第一课：小而精",
 brief:"整个 requests 钩子系统只有 48 行。今天的目标不是看懂多少，而是走完一遍完整流程：限时读、闭卷写、对照、记卡片。",
 qs:[
 {q:"default_hooks() 一行就完事，它返回什么？这个写法叫什么？",a:"返回 <code>{\"response\": []}</code>，写法是 <b>dict comprehension</b>（<code>{event: [] for event in HOOKS}</code>）——以后加新 hook 类型时这里不用改。"},
 {q:"dispatch_hook 里为什么有 if isinstance(hook_list, Callable): hook_list = [hook_list]？",a:"<b>归一化</b>：API 允许用户传单个函数或函数列表，先统一成 list，后面只写一个循环。好接口都这么消化用户输入的多样性。"},
 {q:"第 46 行为什么是 if _hook_data is not None 而不是 if _hook_data？",a:"<code>is not None</code> 区分「hook 返回了空值」和「hook 返回了 None」。用 <code>if _hook_data:</code> 的话，hook 返回 \"\"、0、空对象都会被当成「没返回」，语义就错了。这是 is None 惯用法的标准场景。"},
 {q:"hooks or {} 是什么惯用法？有什么坑？",a:"<code>or</code> 的短路默认值：<code>hooks</code> 为 None 时取 {}。坑：任何 falsy 值（空 dict、0、空串）都会触发兜底而不只是 None，所以只有「空 = 无」的语义下才敢这么写。"}]},
{id:2,file:"requests/src/requests/api.py",gh:"https://github.com/psf/requests/blob/main/src/requests/api.py",title:"requests/api.py",lines:180,focus:"单一入口 + 糖函数",
 brief:"跳过 docstring，代码本体不到 40 行。看完你会发现「干净」的本质是克制。",
 qs:[
 {q:"整个文件的设计是什么？get/post/put... 和 request() 是什么关系？",a:"<b>单一入口 + 糖函数</b>：所有方法都是 request() 的语法糖，request() 又只是包了一层 Session。190 行里真代码 40 行。"},
 {q:"第 70 行为什么用 with sessions.Session()？注释说了什么代价？",a:"with 保证 Session 关闭、不留悬挂 socket。注释原话：会触发 ResourceWarning、看起来像内存泄漏。<b>资源管理是 Python 审查的第一类考点。</b>"},
 {q:"head() 里 kwargs.setdefault(\"allow_redirects\", False) 和直接写死 False 差在哪？",a:"setdefault 只在用户<b>没传</b>时给默认，用户显式传 allow_redirects=True 会保留；写死会吞掉用户意图——AI 生成代码里「吞掉用户输入」极常见。"},
 {q:"签名里的 **kwargs: Unpack[_t.RequestKwargs] 是给谁看的？",a:"给 IDE / mypy 看的类型化 kwargs（TypedDict + Unpack），运行时零作用。认识它，别被吓到。"},
 {q:"get() 的 params 默认值为什么是 None 而不是 {}？",a:"<b>可变默认参数陷阱</b>：{} 默认值会被所有调用共享，一次原地修改就污染后续调用。Python 最著名的坑，也是 AI 代码病灶清单常客。"}]},
{id:3,file:"requests/src/requests/status_codes.py",gh:"https://github.com/psf/requests/blob/main/src/requests/status_codes.py",title:"status_codes.py + LookupDict",lines:128,focus:"属性访问的魔法",
 brief:"主读 status_codes.py（128 行），再对照读 structures.py 第 96 行起的 LookupDict（约 35 行）——题单里可以分别打开两个文件。",
 qs:[
 {q:"codes.ok 这种属性访问是怎么变成 200 的？（线索：LookupDict.__getattr__）",a:"LookupDict 继承 dict 并实现 <code>__getattr__</code>：属性访问查不到时，去自身键值里找并返回。<b>「看起来是属性，其实是查表」</b>——很多框架的「魔法」就是一层 dunder 方法。"},
 {q:"看 _init() 如何往 LookupDict 里灌数据。为什么用函数灌而不是写在类里？",a:"自评要点：数据初始化集中在一个函数里执行，类定义保持干净；这是「类是骨架、数据是内容」的常见组织法。"}]},
{id:4,file:"requests/src/requests/exceptions.py",gh:"https://github.com/psf/requests/blob/main/src/requests/exceptions.py",title:"requests/exceptions.py",lines:162,focus:"异常也是对象",
 brief:"先在纸上画出异常类的继承树（5 分钟），再读代码对照。",
 qs:[
 {q:"RequestException 的 __init__ 比普通异常多做了什么？",a:"自评要点：接收并保存 response 参数（默认 None）——把「出错时的现场」挂在异常对象上，上层拿到异常能直接访问响应。"},
 {q:"为什么 HTTPError 要单独接 response？",a:"自评要点：HTTP 状态码错误是「有响应的错误」；Timeout / ConnectionError 是「没有响应的错误」。异常设计反映了错误的分类学。"}]},
{id:5,file:"requests/src/requests/__init__.py",gh:"https://github.com/psf/requests/blob/main/src/requests/__init__.py",title:"requests/__init__.py",lines:219,focus:"一个包的门面",
 brief:"读大工程第一步永远是读 __init__.py。数一数用户能 import 的名字有几个。",
 qs:[
 {q:"这个文件控制了什么？from requests import get, Session 的「魔法」在哪？",a:"自评要点：<code>from .api import get, post, ...</code> 等导入决定导出面。<b>__init__.py 是包的门面：谁被导出、什么顺序、暴露多少，全在这里。</b>"},
 {q:"注意 import 的顺序和分组。有没有为了避免循环导入做的处理？",a:"自评要点：看导入分组与顺序；能识别「这行 import 为什么写在这里」就开始有工程嗅觉了。"}]},
{id:6,file:"requests/src/requests/sessions.py",gh:"https://github.com/psf/requests/blob/main/src/requests/sessions.py",title:"请求的一生（长训练）",lines:920,focus:"端到端链路追踪",
 brief:"周末 60 分钟长训练。先不看代码，画出 requests.get(url) 到 HTTP 发出的链路图，然后沿代码走一遍对照。",
 chain:["api.get()（api.py L74）","api.request()（api.py L24）— with Session() 创建会话","Session.request()（sessions.py L557）","Session.prepare_request()（L511）— Request 变 PreparedRequest","Session.send()（L752）","HTTPAdapter.send()（adapters.py L634）— 真正发出 HTTP"],
 qs:[
 {q:"对照检查：你画的链路包含哪些跳？漏了哪一跳？",a:"参考链路：<code>api.get → api.request() → Session.request() → prepare_request() → Session.send() → HTTPAdapter.send()</code>。中间 Request → PreparedRequest 这一跳最容易漏。"},
 {q:"Session 继承 SessionRedirectMixin，HTTPAdapter 继承 BaseAdapter。为什么要这样拆？",a:"<b>Mixin</b>：把「重定向处理」独立成可复用的混入类；<b>BaseAdapter</b> 是抽象基类（send 抛 NotImplementedError），定义「适配器必须实现什么」——Python 版的 interface，Week 4 读 Java 时会看到它的显式形态。"}]},
{id:7,file:null,title:"每周复习 · 补卡片",lines:0,focus:"回顾比新学重要",
 brief:"不读新代码。把本周的语法卡片全部过一遍：复述不出来的标回「未掌握」，只查这几张（见「路线与资料」）。复习完点「完成」。",
 qs:[{q:"自检：本周的卡片里，哪几张我复述不出来？",a:"把复述不出来的卡片标回「未掌握」，并只查这几张。漏掉的比读过的值钱。"}]}
];

 {p:"requests/src/requests/api.py",l:180,d:"e",day:2,gh:"https://github.com/psf/requests/blob/main/src/requests/api.py"},

 {p:"requests/src/requests/exceptions.py",l:162,d:"e",day:4,gh:"https://github.com/psf/requests/blob/main/src/requests/exceptions.py"},

 {p:"requests/src/requests/sessions.py",l:920,d:"h",day:6,gh:"https://github.com/psf/requests/blob/main/src/requests/sessions.py"},
 {p:"requests/src/requests/structures.py",l:130,d:"e",gh:"https://github.com/psf/requests/blob/main/src/requests/structures.py"},

function streak(){const ds=Object.values(S.days).filter(d=>d.done).map(d=>d.done).sort();if(!ds.length)return 0;let n=0;let day=today();
 if(ds[ds.length-1]!==day){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(ds[ds.length-1]!==y)return 0}
 while(ds.includes(day)){n++;day=new Date(new Date(day).getTime()-864e5).toISOString().slice(0,10)}return n}
function fdone(p){if(p.day)return !!(S.days[p.day]&&S.days[p.day].done);return !!S.freeMap[p.p]}

function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function tmToggle(id){if(TM.run){clearInterval(TM.run);TM.run=null;document.getElementById("s-"+id).textContent="继续"}
 else{document.getElementById("s-"+id).textContent="暂停";TM.cb=id;

/* ================= 代码高亮 + 批注渲染 ================= */
const CODE_CACHE={};
function highlight(src){
 const RE=/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(\b(?:def|class|import|from|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|try|except|finally|with|as|async|await|yield|lambda|raise|pass|break|continue|global|nonlocal|assert|del|self|cls)\b)/g;
 let out="",last=0,m;
 while((m=RE.exec(src))){
  out+=esc(src.slice(last,m.index));
  const cls=m[1]?"c":m[2]?"s":m[3]?"n":"k";
  out+=`<span class="${cls}">${esc(m[0])}</span>`;last=RE.lastIndex}
 out+=esc(src.slice(last));
 return out.split("\n");
}
function codeRows(path){
 const notes=S.notes[path]||[];const noted={};notes.forEach(n=>{noted[n.line]=(noted[n.line]||[]);noted[n.line].push(n.type)});
 return highlight(CODE_CACHE[path]||"").map((l,i)=>{
  const ln=i+1,ns=noted[ln]||[];
  const mark=ns.length?ns.some(t=>t==="b")?" ●":ns.length>1?" ◆":" ●":"";
  return `<tr id="L${ln}" class="${ns.map(t=>"hl"+t).join(" ")}"><td class="ln" onclick="annOpen('${esc(path)}',${ln})" title="点击写批注">${ln}${mark}</td><td>${l||" "}</td></tr>`;
 }).join("");
}
async function loadCode(path,boxId,focusLine){
 const box=document.getElementById(boxId);
 if(!CODE_CACHE[path]){
  box.innerHTML='<tr><td class="ln">…</td><td>加载中</td></tr>';
  try{const r=await fetch(path);if(!r.ok)throw 0;CODE_CACHE[path]=await r.text()}
  catch(e){box.innerHTML=`<tr><td class="ln">!</td><td>无法读取 ${esc(path)} — 本地使用请从 code-reading-dojo 目录启动服务器（双击 开始训练.command）</td></tr>`;return}
 }
 box.innerHTML=codeRows(path);
 if(focusLine){jumpLine(focusLine)}
}
function jumpLine(ln){const el=document.getElementById("L"+ln);if(!el)return;
 el.scrollIntoView({block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}

function annOpen(path,ln){
 const tr=document.getElementById("L"+ln);if(!tr)return;
 const old=document.querySelector(".annrow");if(old)old.remove();
 if(annOpen._last===ln+"|"+path){annOpen._last=null;return}
 annOpen._last=ln+"|"+path;
 const notes=(S.notes[path]||[]).filter(n=>n.line===ln);
 const row=document.createElement("tr");row.className="annrow";
 row.innerHTML=`<td colspan="2">
  <div class="hd2">第 ${ln} 行的批注 ${notes.length?`（${notes.length} 条）`:""}<span style="margin-left:auto;cursor:pointer;color:var(--faint)" onclick="this.closest('.annrow').remove();annOpen._last=null">收起 ✕</span></div>
  ${notes.map(n=>`<div class="exnote"><span style="color:${NTYPE[n.type].c};flex:none">●</span><span class="tx">${esc(n.text)}</span><span class="del" onclick="delNote('${esc(path)}',${ln},'${n.ts}')">删除</span></div>`).join("")}
  <div class="ntypes" id="nt-sel">${["q","i","b","n"].map(t=>`<button data-t="${t}" class="${t==="q"?"on":""}" onclick="annType(this)">${NTYPE[t].n}</button>`).join("")}</div>
  <div style="display:flex;gap:8px"><input id="ann-txt" placeholder="像读文献一样，在这行旁边写下你的想法…" onkeydown="if(event.key==='Enter')annSave('${esc(path)}',${ln})"><button class="btn small" onclick="annSave('${esc(path)}',${ln})">保存</button></div>
 </td>`;
 tr.after(row);
 row.querySelector("#ann-txt").focus();
}
function annType(btn){row=btn.parentElement;row.querySelectorAll("button").forEach(b=>b.classList.remove("on"));btn.classList.add("on")}
function annSave(path,ln){
 const txt=document.getElementById("ann-txt").value.trim();if(!txt){toast("批注内容不能为空");return}
 const t=document.querySelector("#nt-sel button.on").dataset.t;
 if(!S.notes[path])S.notes[path]=[];
 S.notes[path].push({line:ln,type:t,text:txt,ts:Date.now()});
 save();rerenderCode(path,ln);toast("批注已保存")}
function delNote(path,ln,ts){S.notes[path]=S.notes[path].filter(n=>!(n.line===ln&&String(n.ts)===ts));save();rerenderCode(path,ln)}
function rerenderCode(path,ln){

}
function renderSideNotes(path){

}

function openPractice(f,dayId,focusLine){
 const day=dayId?DAYS.find(d=>d.id===dayId):null;
 const path=f?f.p:null;
 const st=day?(S.days[day.id]||(S.days[day.id]={steps:[false,false,false,false],summary:{a:"",b:"",c:""},done:null})):null;
 const summ=day?st.summary:(S.freeMap[path]||{a:"",b:"",c:""});
 const canDone=day?st.steps.every(Boolean):true;
 const diff=f?DIFF[f.d]:null;
 const v=document.getElementById("v-list");
 v.innerHTML=`
 <div class="back"><button class="btn ghost small" onclick="renderList();window.scrollTo(0,0)">← 返回题单</button></div>
 <div class="phead">
  ${day?`<span class="dayb">Day ${day.id}</span>`:""}
  <h1 style="margin:0">${esc(day?day.title:(path?path.split("/").pop():""))}</h1>
  ${diff?`<span class="badge ${diff.cls}">${diff.t}</span>`:""}
  ${f?`<span class="nc">${f.l} 行</span><a href="${f.gh}" target="_blank" style="font-size:13px">GitHub ↗</a>`:""}
 </div>
 ${day?`<p class="sub" style="margin-bottom:12px">${esc(day.brief)}</p>`:""}
 <div class="prac">
  <div>
   ${day?`
   <div class="card"><h2>流程打卡</h2>
    ${["计时 20 分钟，只读这个文件，不懂的先猜再标记","关上代码，闭卷写下方三行总结","重开代码，对照修正","把没看懂的语法记进卡片本"].map((t,i)=>
    `<label class="chk"><input type="checkbox" ${st.steps[i]?"checked":""} onchange="stepCk(${day.id},${i},this.checked)"><span class="${st.steps[i]?"on":""}" id="sp-${day.id}-${i}">${t}</span></label>`).join("")}
    <div style="margin-top:12px">${timerHTML("p")}</div>
    <div style="margin-top:8px">${[15,20,30,45].map(m=>`<button class="btn ghost small" onclick="tmSet(${m},'p')">${m} 分钟</button>`).join(" ")}</div>
   </div>
   ${day.chain?`<div class="card"><h3>请求的一生 · 参考链路</h3>${day.chain.map((c,i)=>`<div class="sub" style="padding:3px 0">${i+1}. ${esc(c)}</div>`).join("")}</div>`:""}
   `:`
   <div class="card"><h2>自由训练</h2>
    <p class="sub">${path?"限时读这个文件，走和题卡一样的流程。":"复习日。"}</p>
    <div style="margin-top:12px">${timerHTML("p")}</div>
    <div style="margin-top:8px">${[15,20,30,45].map(m=>`<button class="btn ghost small" onclick="tmSet(${m},'p')">${m} 分钟</button>`).join(" ")}</div>
   </div>
   <div class="card"><h3>切换文件</h3>
    <select onchange="if(this.value)openFile(this.value)">${FILES.map(x=>`<option value="${x.p}" ${x.p===path?"selected":""}>${x.p}（${x.l} 行 · ${DIFF[x.d].t}）</option>`).join("")}</select>
   </div>`}
   <div class="card"><h2>闭卷三行总结 <span class="note">（先关掉右边代码再写）</span></h2>
    <h3>① 这个文件的存在意义（一句话）</h3><textarea id="sum-a" placeholder="例如：为整个库提供钩子分发机制…">${esc(summ.a)}</textarea>
    <h3>② 最关键的函数 / 类，它做什么</h3><textarea id="sum-b">${esc(summ.b)}</textarea>
    <h3>③ 我没看懂的地方（最多 3 个）</h3><textarea id="sum-c" placeholder="没看懂的地方 = 下一张卡片">${esc(summ.c)}</textarea>
    <button class="btn small" style="margin-top:10px" onclick="saveSum('${path?esc(path):""}',${day?day.id:"null"})">保存三行总结</button>
   </div>
   <div class="card"><h2>顺手记卡片</h2>
    <div class="grid g2">
     <input id="qc-topic" placeholder="语法点（如：dict comprehension）">
     <input id="qc-src" placeholder="出处（如：hooks.py L26 / 官方 Tutorial 5.5）">
    </div>
    <textarea id="qc-desc" style="margin-top:8px" placeholder="我现在的理解（一句话）"></textarea>
    <button class="btn small" style="margin-top:8px" onclick="quickCard('qc')">记卡片</button>
   </div>
   ${day?`<div style="text-align:center;margin:10px 0"><button class="btn" onclick="finishDay(${day.id})">${st.done?"已完成（可重复训练）":"完成今日训练"}</button></div>`:""}
  </div>
  <div>
   ${path?`
   <div class="card">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
     <h2 style="margin:0">源码批注</h2><span class="nc" id="ann-count">${(S.notes[path]||[]).length} 条批注</span>
     <a href="${f.gh}" target="_blank" style="font-size:12px;margin-left:auto">GitHub ↗</a>
    </div>
    <div class="legend">${Object.entries(NTYPE).map(([k,t])=>`<span><i class="dot" style="background:${t.c}"></i>${t.n}</span>`).join("")}<span class="note" style="margin-left:auto">点击行号写批注</span></div>
    <div class="codebox"><table><tbody id="code-main"></tbody></table></div>
   </div>
   <div class="card"><h3>本文件批注（点击跳转）</h3><div id="side-notes"></div></div>
   `:`
   <div class="card"><h3>复习日</h3><p class="sub">去<a href="#" onclick="go('cards');return false">卡片本</a>过一遍本周卡片，复述不出来的标回「未掌握」，再只查这几张（见<a href="#" onclick="go('road');return false">路线与资料</a>）。</p></div>
   ${day?`<div class="card"><h3>Day ${day.id} 题卡</h3>${day.qs.map((q,i)=>`<div class="qa"><div class="q" onclick="this.parentElement.classList.toggle('open')"><b>Q${i+1}</b><span>${esc(q.q)}</span></div><div class="a">${q.a}</div></div>`).join("")}</div>`:""}
   `}
  </div>
 </div>`;
 document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
 document.getElementById("v-list").classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.v==="list"));
 window.scrollTo(0,0);
 if(path){loadCode(path,"code-main",focusLine);renderSideNotes(path)}
 else if(day){/* 复习日无代码 */}
}
function stepCk(id,i,v){S.days[id].steps[i]=v;save();
 const sp=document.getElementById(`sp-${id}-${i}`);if(sp)sp.classList.toggle("on",v)}
function saveSum(path,dayId){
 const s={a:sumv("sum-a"),b:sumv("sum-b"),c:sumv("sum-c")};
 if(dayId){S.days[dayId].summary=s;save()}
 else if(path){S.freeMap[path]={...s,date:today()};save()}
 toast("三行总结已保存")}
function sumv(i){return document.getElementById(i).value.trim()}
function finishDay(id){const first=!S.days[id].done;S.days[id].done=S.days[id].done||today();save();
 toast(first?`Day ${id} 完成，连续 ${streak()} 天！`:"已更新");renderList();
 if(first){const nx=DAYS.find(d=>d.id===id+1);if(nx)setTimeout(()=>openDay(nx.id),500)}}
function quickCard(pfx){const t=document.getElementById(pfx+"-topic").value.trim();
 if(!t){toast("语法点不能为空");return}
 S.cards.unshift({id:Date.now(),topic:t,desc:document.getElementById(pfx+"-desc").value.trim(),src:document.getElementById(pfx+"-src").value.trim(),date:today(),master:false});
 save();document.getElementById(pfx+"-topic").value="";document.getElementById(pfx+"-desc").value="";document.getElementById(pfx+"-src").value="";
 toast("卡片已记入卡片本")}

/* ================= 批注库 ================= */
function renderNoteLib(){
 const groups=Object.entries(S.notes).filter(([p,ns])=>ns.length);
 document.getElementById("v-notes").innerHTML=`
 <h1>批注库</h1><p class="sub">所有代码批注按文件汇总，像文献笔记一样沉淀。点击任意一条跳回原文。</p>
 ${groups.length?groups.map(([p,ns])=>`<div class="card">
  <h3 style="margin-top:0"><a href="#" onclick="openFile('${esc(p)}');return false">${p}</a> <span class="nc">${ns.length} 条</span></h3>
  ${ns.slice().sort((a,b)=>a.line-b.line).map(n=>`<div class="nrow" onclick="openFile('${esc(p)}',${n.line})">
   <span class="gl">L${n.line}</span><span style="color:${NTYPE[n.type].c};flex:none">●</span><span class="gtxt">${esc(n.text)}</span>
  </div>`).join("")}
 </div>`).join(""):'<div class="card"><div class="empty">还没有批注 — 练习时点击代码行号即可写</div></div>'}`;
}

/* ================= 卡片本 ================= */
let cardFilter="all";
function renderCards(){
 const list=S.cards.filter(c=>cardFilter==="all"||(cardFilter==="no"?!c.master:c.master));
 document.getElementById("v-cards").innerHTML=`
 <h1>卡片本</h1><p class="sub">语法卡片台账：<b>语法点 | 我的理解 | 出处</b>。每周日过一遍，复述不出来的标回「未掌握」。</p>
 <div class="card"><h2>新增卡片</h2>
  <div class="grid g2">
   <input id="nc-topic" placeholder="语法点（如：is None 惯用法）">
   <input id="nc-src" placeholder="出处（如：api.py L75 / Fluent Python ch8）">
  </div>
  <textarea id="nc-desc" style="margin-top:8px" placeholder="我现在的理解（一句话）"></textarea>
  <button class="btn small" style="margin-top:8px" onclick="quickCard('nc')">记卡片</button>
 </div>
 <div style="margin-bottom:12px">
  ${[["all","全部 "+S.cards.length],["no","未掌握 "+S.cards.filter(c=>!c.master).length],["yes","已掌握 "+S.cards.filter(c=>c.master).length]].map(([k,t])=>
  `<button class="btn small ${cardFilter===k?"":"ghost"}" onclick="cardFilter='${k}';renderCards()">${t}</button>`).join(" ")}
 </div>
 ${list.length?list.map(c=>`<div class="fcard ${c.master?"master":""}">
  <div class="top"><span class="topic">${esc(c.topic)}</span><span class="tag ${c.master?"good":"warn"}">${c.master?"已掌握":"未掌握"}</span><span class="date">${c.date}</span></div>
  ${c.desc?`<div class="desc">${esc(c.desc)}</div>`:""}
  ${c.src?`<div class="src">出处：${esc(c.src)}</div>`:""}
  <div class="ops">
   <button class="btn ghost small" onclick="tgCard(${c.id})">${c.master?"标为未掌握":"标为已掌握"}</button>
   <button class="btn ghost small" onclick="delCard(${c.id})">删除</button>
  </div></div>`).join(""):'<div class="empty">还没有卡片 — 训练时遇到不懂的语法，随手记一张</div>'}`;
}
function tgCard(id){const c=S.cards.find(x=>x.id===id);c.master=!c.master;save();renderCards()}
function delCard(id){S.cards=S.cards.filter(x=>x.id!==id);save();renderCards()}

/* ================= 病灶笔记 ================= */
function renderBugs(){
 document.getElementById("v-bugs").innerHTML=`
 <h1>病灶笔记</h1><p class="sub">AI 生成代码的八大高频病灶先背熟；训练中<b>漏掉的</b> bug 记在这里，漏掉的比找到的值钱。</p>
 <div class="card"><h3>八大病灶速查</h3>
  ${BUG_PATTERNS.map((b,i)=>`<div class="chk"><input type="checkbox" disabled><span>${i+1} · ${esc(b)}</span></div>`).join("")}
 </div>
 <div class="card"><h2>新增病灶记录</h2>
  <input id="nb-symp" placeholder="症状（如：except Exception: pass 吞掉了超时错误）">
  <textarea id="nb-ctx" style="margin-top:8px" placeholder="在哪个文件 / 什么场景遇到的"></textarea>
  <textarea id="nb-lesson" style="margin-top:8px" placeholder="教训：下次先查什么"></textarea>
  <button class="btn small" style="margin-top:8px" onclick="addBug()">记录</button>
 </div>
 ${S.bugs.length?S.bugs.map(b=>`<div class="fcard" style="border-left-color:var(--bad)">
  <div class="top"><span class="topic">${esc(b.symp)}</span><span class="tag bad">病灶</span><span class="date">${b.date}</span></div>
  ${b.ctx?`<div class="desc">${esc(b.ctx)}</div>`:""}
  ${b.lesson?`<div class="src">教训：${esc(b.lesson)}</div>`:""}
  <div class="ops"><button class="btn ghost small" onclick="delBug(${b.id})">删除</button></div>
 </div>`).join(""):'<div class="empty">还没有病灶记录</div>'}`;
}
function addBug(){const s=document.getElementById("nb-symp").value.trim();if(!s){toast("症状不能为空");return}
 S.bugs.unshift({id:Date.now(),symp:s,ctx:document.getElementById("nb-ctx").value.trim(),lesson:document.getElementById("nb-lesson").value.trim(),date:today()});
 save();renderBugs();toast("已记录")}
function delBug(id){S.bugs=S.bugs.filter(x=>x.id!==id);save();renderBugs()}

/* ================= 路线与资料 ================= */
function renderRoad(){
 document.getElementById("v-road").innerHTML=`
 <h1>八周课表</h1><p class="sub">完整计划与项目分级清单见 <span class="pill">训练手册.md</span>（仓库根目录）</p>
 <div class="card"><table class="plain"><tr><th>周</th><th>材料</th><th>目标</th></tr>
  ${ROADMAP.map(r=>`<tr><td>W${r.w}</td><td>${esc(r.t)}</td><td class="sub">${esc(r.g)}</td></tr>`).join("")}
 </table></div>
 ${RESOURCES.map(g=>`<div class="card"><h2>${esc(g.g)}</h2><div class="links">
  ${g.items.map(([t,u,d])=>`<a href="${u}" target="_blank">${esc(t)} <span class="note">— ${esc(d)}</span></a>`).join("")}
 </div></div>`).join("")}`;
}

document.getElementById("streakN").textContent=streak();
renderHome();
</script>
