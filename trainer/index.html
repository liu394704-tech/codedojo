<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码道场 · CodeDojo</title>
<style>
:root{
  --bg:#141517; --panel:#1d1f23; --panel2:#232629; --border:#32363b;
  --text:#e8e8e6; --muted:#9a9a94; --faint:#6e6e68;
  --accent:#6c8cff; --accent-dim:#39466e;
  --good:#4cc38a; --warn:#f0b429; --bad:#e5484d;
  --radius:12px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:13px}
input,textarea,select{font-family:inherit;font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}
header{position:sticky;top:0;z-index:50;background:rgba(20,21,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hd{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:600;font-size:16px;letter-spacing:.5px}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px}
nav button.active{background:var(--panel2);color:var(--text)}
nav button:hover:not(.active){color:var(--text)}
.streak{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted)}
.streak b{color:var(--warn);font-size:15px}
.view{display:none;padding-top:24px}
.view.active{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
h1{font-size:20px;margin-bottom:6px;font-weight:600}
h2{font-size:16px;margin-bottom:12px;font-weight:600}
h3{font-size:14px;margin:14px 0 8px;font-weight:600;color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat .num{font-size:24px;font-weight:600;color:var(--accent)}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.btn{background:var(--accent);color:#fff;padding:9px 18px;font-weight:500}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.small{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.daycard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .15s}
.daycard:hover{border-color:var(--accent)}
.daycard .d{font-size:12px;color:var(--faint)}
.daycard .t{font-size:13px;margin:4px 0;font-weight:500}
.daycard .done{color:var(--good);font-size:12px}
.daycard.now{border-color:var(--warn)}
.week{display:flex;gap:6px;margin:10px 0}
.week i{flex:1;height:6px;border-radius:3px;background:var(--panel2)}
.week i.done{background:var(--good)} .week i.now{background:var(--warn)}
/* 计时器 */
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer .disp{font-family:var(--mono);font-size:34px;font-weight:600;min-width:110px}
.timer .disp.hot{color:var(--warn)}
.tbar{flex:1;min-width:120px;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:0%}
.timeup{background:rgba(240,180,41,.12);border:1px solid var(--warn);color:var(--warn);padding:10px 14px;border-radius:8px;margin-top:10px;display:none}
/* 代码阅读器 */
.codebox{background:#101113;border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:520px;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.codebox table{border-collapse:collapse;width:100%}
.codebox td{padding:0 10px 0 0;white-space:pre;vertical-align:top}
.codebox .ln{color:var(--faint);text-align:right;user-select:none;width:1%;padding-left:14px}
.codebox tr:hover{background:rgba(108,140,255,.06)}
.k{color:#7aa2f7}.s{color:#9ece6a}.c{color:#565f89;font-style:italic}.n{color:#ff9e64}.d{color:#bb9af7}
/* 问答 */
.qa{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}
.qa .q{padding:12px 14px;background:var(--panel2);display:flex;gap:10px;cursor:pointer}
.qa .q b{color:var(--accent);font-family:var(--mono)}
.qa .a{padding:12px 14px;display:none;border-top:1px solid var(--border)}
.qa.open .a{display:block}
.qa .q::after{content:"展开";margin-left:auto;color:var(--faint);font-size:12px}
.qa.open .q::after{content:"收起"}
/* 表格 */
table.plain{width:100%;border-collapse:collapse;font-size:13px}
table.plain th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border)}
table.plain td{padding:8px 10px;border-bottom:1px solid rgba(50,54,59,.5);vertical-align:top}
/* 清单 */
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(50,54,59,.4);cursor:pointer}
.chk input{width:16px;height:16px;flex:none;margin-top:3px;accent-color:var(--good);cursor:pointer}
.chk span.on{color:var(--faint);text-decoration:line-through}
/* 卡片 */
.fcard{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.fcard.master{border-left-color:var(--good);opacity:.65}
.fcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fcard .topic{font-weight:600}
.fcard .date{color:var(--faint);font-size:12px;margin-left:auto}
.fcard .desc{margin-top:6px;color:var(--muted)}
.fcard .src{margin-top:4px;font-size:12px;color:var(--faint)}
.fcard .ops{margin-top:8px;display:flex;gap:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.tag.good{color:var(--good)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
/* toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--good);color:var(--text);padding:10px 22px;border-radius:10px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.back{margin-bottom:14px}
.pill{display:inline-block;background:var(--panel2);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted);margin-right:6px}
.links a{display:block;padding:4px 0}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.note{font-size:12px;color:var(--faint)}
.empty{color:var(--faint);text-align:center;padding:30px 0}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo">代码<span>道场</span></div>
  <nav id="nav">
    <button data-v="home" class="active">今日</button>
    <button data-v="camp">训练营</button>
    <button data-v="free">自由训练</button>
    <button data-v="cards">卡片本</button>
    <button data-v="bugs">病灶笔记</button>
    <button data-v="road">路线与资料</button>
  </nav>

</div></header>

</div>

const TM={left:1200,total:1200,run:null,cb:null};
function timerHTML(id){return `<div class="timer">
 <div class="disp" id="d-${id}">20:00</div>
 <div class="tbar"><i id="b-${id}"></i></div>
 <button class="btn small" id="s-${id}" onclick="tmToggle('${id}')">开始</button>

</div><div class="timeup" id="u-${id}">时间到 — 关上代码，闭卷写三行总结</div>`}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function tmToggle(id){if(TM.run){clearInterval(TM.run);TM.run=null;document.getElementById("s-"+id).textContent="继续"}
 else{document.getElementById("s-"+id).textContent="暂停";TM.cb=id;
  TM.run=setInterval(()=>{TM.left--;const d=document.getElementById("d-"+TM.cb);if(!d){clearInterval(TM.run);TM.run=null;return}
   d.textContent=fmt(TM.left);document.getElementById("b-"+TM.cb).style.width=(100*(TM.total-TM.left)/TM.total)+"%";
   d.classList.toggle("hot",TM.left<=300);
   if(TM.left<=0){clearInterval(TM.run);TM.run=null;document.getElementById("s-"+TM.cb).textContent="开始";document.getElementById("u-"+TM.cb).style.display="block";try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();o.stop(c.currentTime+.3);setTimeout(()=>o.start(),400)}catch(e){}}
  },1000)}}
function tmReset(id){if(TM.run){clearInterval(TM.run);TM.run=null}TM.left=TM.total;TM.cb=id;const d=document.getElementById("d-"+id);d.textContent=fmt(TM.left);d.classList.remove("hot");document.getElementById("b-"+id).style.width="0";document.getElementById("s-"+id).textContent="开始";document.getElementById("u-"+id).style.display="none"}
function tmSet(min,id){TM.total=TM.left=min*60;tmReset(id)}

/* ================= 代码阅读器 ================= */
const KW=/\b(def|class|import|from|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|try|except|finally|with|as|async|await|yield|lambda|raise|pass|break|continue|global|nonlocal|assert|del|self|cls)\b/;
function highlight(src){
 const RE=/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(\b(?:def|class|import|from|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|try|except|finally|with|as|async|await|yield|lambda|raise|pass|break|continue|global|nonlocal|assert|del|self|cls)\b)/g;
 let out="",last=0,m;
 while((m=RE.exec(src))){
  out+=esc(src.slice(last,m.index));
  const cls=m[1]?"c":m[2]?"s":m[3]?"n":"k";
  out+=`<span class="${cls}">${esc(m[0])}</span>`;last=RE.lastIndex}
 out+=esc(src.slice(last));
 return out.split("\n").map((l,i)=>`<tr><td class="ln">${i+1}</td><td>${l||" "}</td></tr>`).join("");
}
async function loadCode(path,boxId){
 const box=document.getElementById(boxId);
 box.innerHTML='<tr><td class="ln">…</td><td>加载中</td></tr>';
 try{const r=await fetch(path);if(!r.ok)throw 0;const src=await r.text();
  box.innerHTML=highlight(src);
 }catch(e){box.innerHTML=`<tr><td class="ln">!</td><td>无法读取 ${esc(path)} — 请从 code-reading-dojo 目录启动本地服务器（双击 start.command）</td></tr>`}
}

 S.free.unshift({file,a,b:sumv("fs-b"),c:sumv("fs-c"),date:today()});
 const done=S.free.filter(f=>f.date===today()).length;
 if(done>=1&&!S.freeDone){S.freeDone=today()}
 save();document.getElementById("fs-a").value="";document.getElementById("fs-b").value="";document.getElementById("fs-c").value="";
 toast("总结已保存（今日 "+done+" 次）")}

/* ================= 卡片本 ================= */
let cardFilter="all";
function renderCards(){
 const list=S.cards.filter(c=>cardFilter==="all"||(cardFilter==="no"?!c.master:c.master));
 document.getElementById("v-cards").innerHTML=`
 <h1>卡片本</h1><p class="sub">语法卡片台账：<b>语法点 | 我的理解 | 出处</b>。每周日过一遍，复述不出来的标回「未掌握」。</p>
 <div class="card"><h2>新增卡片</h2>
  <div class="grid g3">
   <input id="nc-topic" placeholder="语法点（如：is None 惯用法）">
   <input id="nc-src" placeholder="出处（如：api.py L75 / Fluent Python ch8）">
  </div>
  <textarea id="nc-desc" style="margin-top:8px" placeholder="我现在的理解（一句话）"></textarea>
  <button class="btn small" style="margin-top:8px" onclick="quickCard('nc')">记卡片</button>
 </div>
 <div style="margin-bottom:12px">
  ${[["all","全部 "+S.cards.length],["no","未掌握 "+S.cards.filter(c=>!c.master).length],["yes","已掌握 "+S.cards.filter(c=>c.master).length]].map(([k,t])=>
  `<button class="btn small ${cardFilter===k?"":"ghost"}" onclick="cardFilter='${k}';renderCards()">${t}</button>`).join(" ")}
 </div>
 ${list.length?list.map(c=>`<div class="fcard ${c.master?"master":""}">
  <div class="top"><span class="topic">${esc(c.topic)}</span><span class="tag ${c.master?"good":"warn"}">${c.master?"已掌握":"未掌握"}</span><span class="date">${c.date}</span></div>
  ${c.desc?`<div class="desc">${esc(c.desc)}</div>`:""}
  ${c.src?`<div class="src">出处：${esc(c.src)}</div>`:""}
  <div class="ops">
   <button class="btn ghost small" onclick="tgCard(${c.id})">${c.master?"标为未掌握":"标为已掌握"}</button>
   <button class="btn ghost small" onclick="delCard(${c.id})">删除</button>
  </div></div>`).join(""):'<div class="empty">还没有卡片 — 训练时遇到不懂的语法，随手记一张</div>'}`;
}
function tgCard(id){const c=S.cards.find(x=>x.id===id);c.master=!c.master;save();renderCards()}
function delCard(id){S.cards=S.cards.filter(x=>x.id!==id);save();renderCards()}

/* ================= 病灶笔记 ================= */
function renderBugs(){
 document.getElementById("v-bugs").innerHTML=`
 <h1>病灶笔记</h1><p class="sub">AI 生成代码的八大高频病灶先背熟；训练中<b>漏掉的</b> bug 记在这里，漏掉的比找到的值钱。</p>
 <div class="card"><h3>八大病灶速查</h3>
  ${BUG_PATTERNS.map((b,i)=>`<div class="chk"><input type="checkbox" disabled><span>${i+1} · ${esc(b)}</span></div>`).join("")}
 </div>
 <div class="card"><h2>新增病灶记录</h2>
  <input id="nb-symp" placeholder="症状（如：except Exception: pass 吞掉了超时错误）">
  <textarea id="nb-ctx" style="margin-top:8px" placeholder="在哪个文件 / 什么场景遇到的"></textarea>
  <textarea id="nb-lesson" style="margin-top:8px" placeholder="教训：下次先查什么"></textarea>
  <button class="btn small" style="margin-top:8px" onclick="addBug()">记录</button>
 </div>
 ${S.bugs.length?S.bugs.map(b=>`<div class="fcard" style="border-left-color:var(--bad)">
  <div class="top"><span class="topic">${esc(b.symp)}</span><span class="tag bad">病灶</span><span class="date">${b.date}</span></div>
  ${b.ctx?`<div class="desc">${esc(b.ctx)}</div>`:""}
  ${b.lesson?`<div class="src">教训：${esc(b.lesson)}</div>`:""}
  <div class="ops"><button class="btn ghost small" onclick="delBug(${b.id})">删除</button></div>
 </div>`).join(""):'<div class="empty">还没有病灶记录</div>'}`;
}
function addBug(){const s=document.getElementById("nb-symp").value.trim();if(!s){toast("症状不能为空");return}
 S.bugs.unshift({id:Date.now(),symp:s,ctx:document.getElementById("nb-ctx").value.trim(),lesson:document.getElementById("nb-lesson").value.trim(),date:today()});
 save();renderBugs();toast("已记录")}
function delBug(id){S.bugs=S.bugs.filter(x=>x.id!==id);save();renderBugs()}

/* ================= 路线与资料 ================= */
function renderRoad(){
 document.getElementById("v-road").innerHTML=`
 <h1>八周课表</h1><p class="sub">完整计划与项目分级清单见 <span class="pill">code-reading-dojo/训练手册.md</span></p>
 <div class="card"><table class="plain"><tr><th>周</th><th>材料</th><th>目标</th></tr>
  ${ROADMAP.map(r=>`<tr><td>W${r.w}</td><td>${esc(r.t)}</td><td class="sub">${esc(r.g)}</td></tr>`).join("")}
 </table></div>
 ${RESOURCES.map(g=>`<div class="card"><h2>${esc(g.g)}</h2><div class="links">
  ${g.items.map(([t,u,d])=>`<a href="${u}" target="_blank">${esc(t)} <span class="note">— ${esc(d)}</span></a>`).join("")}
 </div></div>`).join("")}`;
}

/* ================= 启动 ================= */
document.getElementById("streakN").textContent=streak();
document.getElementById("doneN").textContent="已完成 "+DAYS.filter(d=>S.days[d.id]&&S.days[d.id].done).length+" 天";
renderHome();
</script>
